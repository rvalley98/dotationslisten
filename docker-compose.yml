# Runs on the home server in the local network.
#   docker compose up -d
#   docker compose exec ollama ollama pull <model>
# Web UI: http://<server>:8000  (reachable in the LAN only - do not forward this port in the router)

services:
  app:
    build: .
    image: dotationslisten:dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5vl:7b}
    volumes:
      # All Vorgänge, scans, exports live here - outside the container, so rebuilds keep them.
      # Different location (e.g. a NAS mount): DATA_PATH=/mnt/nas/dotationslisten in .env
      # data/eingang is the scanner's target folder (e.g. shared via SMB)
      - ${DATA_PATH:-./data}:/data

  # Recognition on the server itself (CPU): docker compose --profile ollama up -d
  # Recognition on another machine (e.g. the Mac): set OLLAMA_URL=http://<mac>:11434 in .env
  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    # NVIDIA GPU on the server? Uncomment (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama:
